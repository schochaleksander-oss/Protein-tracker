<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protein Tracker Pro</title>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #FF5722;
      --text-color: #ffffff;
      --text-dim: #aaa;
      --danger-color: #d32f2f;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      color: var(--accent-color);
      margin-bottom: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .progress-bar-bg {
      background: #333;
      height: 20px;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-bar-fill {
      background: var(--accent-color);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .action-btn {
      flex: 1;
      background: var(--accent-color);
      color: white;
      text-align: center;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      font-size: 0.9rem;
    }

    .secondary-btn {
      background: #333;
      border: 1px solid #555;
    }

    .danger-btn {
      background: var(--danger-color);
      color: white;
    }

    .small-btn-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .small-btn {
      flex: 1;
      background: #2a2a2a;
      border: 1px solid #444;
      color: var(--text-dim);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    input[type="file"] {
      display: none;
    }

    #preview-img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 10px;
      display: none;
      max-height: 200px;
      object-fit: cover;
    }

    .input-group {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    input[type="number"] {
      background: #2a2a2a;
      border: 1px solid #444;
      color: white;
      padding: 8px;
      border-radius: 6px;
      width: 80px;
      text-align: center;
      font-size: 1rem;
    }

    .trust-badge {
      font-size: 0.85rem;
      color: #FF9800;
      margin-top: 5px;
    }

    #barcode-scanner {
      display: none;
      margin-bottom: 15px;
    }

    video {
      width: 100%;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Protein Tracker Pro</h1>

  <!-- Fortschrittsanzeige -->
  <div class="card">
    <h3>Tagesziel: <span id="current-protein">0</span> / <span id="target-protein">140</span>g Protein</h3>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
    <!-- Buttons zum Korrigieren/Zurücksetzen -->
    <div class="small-btn-group">
      <button class="small-btn" onclick="undoLastEntry()">↩ Letzten Eintrag löschen</button>
      <button class="small-btn" onclick="resetDay()">🗑 Tag zurücksetzen</button>
    </div>
  </div>

  <!-- Aktionen -->
  <div class="btn-group">
    <label class="action-btn">
      📷 Teller scannen (KI)
      <input type="file" accept="image/*" capture="environment" id="photo-input">
    </label>
    <button class="action-btn secondary-btn" onclick="startBarcodeScanner()">
      █║▌ Barcode
    </button>
  </div>

  <!-- Live Barcode Kamera Bereich -->
  <div class="card" id="barcode-scanner">
    <h4>Barcode in die Kamera halten:</h4>
    <video id="barcode-video"></video>
    <button class="action-btn secondary-btn" style="margin-top:10px;" onclick="stopBarcodeScanner()">Abbrechen</button>
  </div>

  <!-- Ergebnisse & Anpassung -->
  <div class="card" id="result-card" style="display: none;">
    <img id="preview-img" src="" alt="Vorschau">
    <h4 id="detected-food">Warte auf Eingabe...</h4>
    <div class="trust-badge" id="trust-badge">Analyse...</div>

    <div class="input-group">
      <label for="portion">Portion in Gramm:</label>
      <input type="number" id="portion" value="100" oninput="recalculate()">
    </div>

    <div class="input-group">
      <label>Berechnetes Protein:</label>
      <strong id="calc-protein">0g</strong>
    </div>

    <div class="btn-group" style="margin-top: 15px; margin-bottom: 0;">
      <button class="action-btn" onclick="addProtein()">Hinzufügen</button>
      <button class="action-btn danger-btn" onclick="cancelScan()">Abbrechen</button>
    </div>
  </div>
</div>

<script>
  // FÜGE HIER DEINEN OPENROUTER API-KEY EIN:
  const API_KEY = "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";

  let dailyGoal = 140;
  let currentTotal = 0;
  let lastAddedAmount = 0;
  let detectedProteinPer100g = 0;
  let codeReader = null;

  const photoInput = document.getElementById('photo-input');
  const resultCard = document.getElementById('result-card');
  const previewImg = document.getElementById('preview-img');
  const portionInput = document.getElementById('portion');
  const calcProteinText = document.getElementById('calc-protein');

  // --- 1. KI ERKENNUNG MIT AUTOMATISCHER BILD-VERKLEINERUNG ---
  photoInput.addEventListener('change', function() {
    if (this.files && this.files[0]) {
      const file = this.files[0];
      
      previewImg.src = URL.createObjectURL(file);
      previewImg.style.display = 'block';
      resultCard.style.display = 'block';
      
      document.getElementById('detected-food').innerText = "KI analysiert das Bild...";
      document.getElementById('trust-badge').innerText = "Bild wird optimiert & gesendet...";

      resizeImage(file, 800, 800, async function(base64Data) {
        await analyzeWithOpenRouter(base64Data);
      });
    }
  });

  function resizeImage(file, maxWidth, maxHeight, callback) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
        } else {
          if (height > maxHeight) {
            width = Math.round((width * maxHeight) / height);
            height = maxHeight;
          }
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        callback(dataUrl.split(',')[1]);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function analyzeWithOpenRouter(base64Data) {
    try {
      const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${API_KEY}`,
          "HTTP-Referer": window.location.origin,
          "X-Title": "Protein Tracker",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          "model": "openrouter/free",
          "messages": [
            {
              "role": "user",
              "content": [
                {
                  "type": "text",
                  "text": "Identify the main food in this image and estimate its protein per 100g. Return ONLY raw JSON with keys: foodName (string in German), proteinPer100g (number), confidencePercent (number 0-100). Example: {\"foodName\": \"Butter\", \"proteinPer100g\": 0.7, \"confidencePercent\": 90}"
                },
                {
                  "type": "image_url",
                  "image_url": {
                    "url": `data:image/jpeg;base64,${base64Data}`
                  }
                }
              ]
            }
          ]
        })
      });

      const data = await response.json();

      if (data.error) {
        document.getElementById('detected-food').innerText = "API-Fehler";
        document.getElementById('trust-badge').innerText = data.error.message || "Fehler von OpenRouter";
        return;
      }

      const rawText = data.choices[0].message.content.trim();
      const jsonMatch = rawText.match(/\{[\s\S]*\}/);
      
      if (!jsonMatch) {
        throw new Error("Kein JSON gefunden");
      }

      const result = JSON.parse(jsonMatch[0]);

      document.getElementById('detected-food').innerText = result.foodName || "Erkanntes Essen";
      document.getElementById('trust-badge').innerText = `KI-Genauigkeit: ${result.confidencePercent || 80}%`;
      
      detectedProteinPer100g = result.proteinPer100g || 0;
      portionInput.value = 100;
      recalculate();

    } catch (error) {
      console.error(error);
      document.getElementById('detected-food').innerText = "Erkennungsfehler";
      document.getElementById('trust-badge').innerText = "Bild konnte nicht ausgewertet werden.";
    }
  }

  // --- 2. BARCODE SCANNER ---
  function startBarcodeScanner() {
    document.getElementById('barcode-scanner').style.display = 'block';
    codeReader = new ZXing.BrowserMultiFormatReader();
    
    codeReader.decodeFromVideoDevice(null, 'barcode-video', (result, err) => {
      if (result) {
        fetchProductByBarcode(result.text);
        stopBarcodeScanner();
      }
    });
  }

  function stopBarcodeScanner() {
    if (codeReader) {
      codeReader.reset();
    }
    document.getElementById('barcode-scanner').style.display = 'none';
  }

  async function fetchProductByBarcode(barcode) {
    resultCard.style.display = 'block';
    previewImg.style.display = 'none';
    document.getElementById('detected-food').innerText = "Suche Barcode...";

    try {
      const response = await fetch(`https://de.openfoodfacts.org/api/v0/product/${barcode}.json`);
      const data = await response.json();

      if (data.status === 1) {
        const product = data.product;
        const name = product.product_name_de || product.product_name || "Unbekanntes Produkt";
        const protein = product.nutriments ? (product.nutriments.proteins_100g || 0) : 0;

        document.getElementById('detected-food').innerText = name;
        document.getElementById('trust-badge').innerText = "Exakter Barcode-Treffer";
        
        detectedProteinPer100g = protein;
        portionInput.value = 100;
        recalculate();
      } else {
        document.getElementById('detected-food').innerText = "Produkt nicht in der Datenbank.";
      }
    } catch (error) {
      document.getElementById('detected-food').innerText = "Netzwerkfehler beim Scannen.";
    }
  }

  // --- 3. RECHNER UND KORREKTUR-FUNKTIONEN ---
  function recalculate() {
    let grams = parseFloat(portionInput.value) || 0;
    let total = (grams / 100) * detectedProteinPer100g;
    calcProteinText.innerText = total.toFixed(1) + "g";
  }

  function addProtein() {
    let grams = parseFloat(portionInput.value) || 0;
    let addedProtein = (grams / 100) * detectedProteinPer100g;
    
    lastAddedAmount = addedProtein;
    currentTotal += addedProtein;
    
    updateUI();
    cancelScan();
  }

  function cancelScan() {
    resultCard.style.display = 'none';
    photoInput.value = "";
    previewImg.src = "";
    detectedProteinPer100g = 0;
  }

  function undoLastEntry() {
    if (lastAddedAmount > 0) {
      currentTotal = Math.max(0, currentTotal - lastAddedAmount);
      lastAddedAmount = 0;
      updateUI();
    }
  }

  function resetDay() {
    if (confirm("Möchtest du das heutige Proteinziel wirklich auf 0g zurücksetzen?")) {
      currentTotal = 0;
      lastAddedAmount = 0;
      updateUI();
    }
  }

  function updateUI() {
    document.getElementById('current-protein').innerText = currentTotal.toFixed(1);
    let percentage = Math.min((currentTotal / dailyGoal) * 100, 100);
    document.getElementById('progress-fill').style.width = percentage + "%";
  }
</script>

</body>
</html>
