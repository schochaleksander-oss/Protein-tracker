<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protein & Calorie Tracker</title>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-protein: #FF5722;
      --accent-calories: #FFC107;
      --text-color: #ffffff;
      --text-dim: #aaa;
      --danger-color: #d32f2f;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      color: var(--accent-protein);
      margin-bottom: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .metric-title {
      font-size: 0.95rem;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .progress-bar-bg {
      background: #333;
      height: 14px;
      border-radius: 7px;
      overflow: hidden;
      margin-top: 6px;
      margin-bottom: 12px;
    }

    .progress-bar-fill-protein {
      background: var(--accent-protein);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-bar-fill-calories {
      background: var(--accent-calories);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .action-btn {
      flex: 1;
      background: var(--accent-protein);
      color: white;
      text-align: center;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      font-size: 0.9rem;
    }

    .secondary-btn {
      background: #333;
      border: 1px solid #555;
    }

    .danger-btn {
      background: var(--danger-color);
      color: white;
    }

    .small-btn-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .small-btn {
      flex: 1;
      background: #2a2a2a;
      border: 1px solid #444;
      color: var(--text-dim);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    input[type="file"] {
      display: none;
    }

    #preview-img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 10px;
      display: none;
      max-height: 200px;
      object-fit: cover;
    }

    .input-group {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    input[type="number"], select {
      background: #2a2a2a;
      border: 1px solid #444;
      color: white;
      padding: 10px;
      border-radius: 6px;
      font-size: 1rem;
      width: 100%;
      box-sizing: border-box;
    }

    .trust-badge {
      font-size: 0.85rem;
      color: #FF9800;
      margin-top: 5px;
    }

    .package-info {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 2px;
    }

    #barcode-scanner {
      display: none;
      margin-bottom: 15px;
    }

    video {
      width: 100%;
      border-radius: 8px;
    }

    /* Modal / Fragebogen Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }

    .modal-card h2 {
      margin-top: 0;
      color: var(--accent-protein);
      font-size: 1.3rem;
    }
  </style>
</head>
<body>

<!-- ONBOARDING UMFRAGE MODAL -->
<div class="modal-overlay" id="onboarding-modal" style="display: none;">
  <div class="modal-card">
    <h2>Dein Profil & Ziel</h2>
    <p style="font-size: 0.85rem; color: var(--text-dim);">Lass uns deinen individuellen Bedarf an Protein und Kalorien berechnen.</p>
    
    <div class="input-group">
      <label>Geschlecht:</label>
      <select id="user-gender">
        <option value="male">Männlich</option>
        <option value="female">Weiblich</option>
      </select>
    </div>

    <div class="input-group">
      <label>Alter (Jahre):</label>
      <input type="number" id="user-age" value="25" placeholder="z. B. 25">
    </div>

    <div class="input-group">
      <label>Körpergröße (cm):</label>
      <input type="number" id="user-height" value="175" placeholder="z. B. 175">
    </div>

    <div class="input-group">
      <label>Gewicht (kg):</label>
      <input type="number" id="user-weight" value="75" placeholder="z. B. 75">
    </div>

    <div class="input-group">
      <label>Dein Hauptziel:</label>
      <select id="user-goal">
        <option value="build">Muskelaufbau / Training</option>
        <option value="lose">Fett abnehmen</option>
        <option value="maintain">Gewicht halten</option>
      </select>
    </div>

    <button class="action-btn" style="width: 100%; margin-top: 20px;" onclick="saveUserProfile()">Ziele berechnen & starten</button>
  </div>
</div>

<div class="container">
  <h1>Protein & Calorie Tracker</h1>

  <!-- Fortschrittsanzeige -->
  <div class="card">
    <div class="metric-title">
      <span>Protein:</span>
      <span><strong id="current-protein">0</strong> / <span id="target-protein">140</span>g</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill-protein" id="progress-fill-protein"></div>
    </div>

    <div class="metric-title">
      <span>Kalorien:</span>
      <span><strong id="current-calories">0</strong> / <span id="target-calories">2000</span> kcal</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill-calories" id="progress-fill-calories"></div>
    </div>

    <!-- Buttons zum Korrigieren/Zurücksetzen/Profil anpassen -->
    <div class="small-btn-group">
      <button class="small-btn" onclick="undoLastEntry()"> Letzten Eintrag löschen</button>
      <button class="small-btn" onclick="resetDay()"> Tag zurücksetzen</button>
    </div>
    <div class="small-btn-group">
      <button class="small-btn" onclick="openOnboarding()"> Profil / Ziele anpassen</button>
    </div>
  </div>

  <!-- Aktionen -->
  <div class="btn-group">
    <label class="action-btn">
      📷 Essen / Packung scannen
      <input type="file" accept="image/*" capture="environment" id="photo-input">
    </label>
    <button class="action-btn secondary-btn" onclick="startBarcodeScanner()">
      █║▌ Barcode
    </button>
  </div>

  <!-- Live Barcode Kamera Bereich -->
  <div class="card" id="barcode-scanner">
    <h4>Barcode in die Kamera halten:</h4>
    <video id="barcode-video"></video>
    <button class="action-btn secondary-btn" style="margin-top:10px;" onclick="stopBarcodeScanner()">Abbrechen</button>
  </div>

  <!-- Ergebnisse & Anpassung -->
  <div class="card" id="result-card" style="display: none;">
    <img id="preview-img" src="" alt="Vorschau">
    <h4 id="detected-food" style="margin-bottom: 2px;">Warte auf Eingabe...</h4>
    <div class="package-info" id="detected-package">Erkanntes Packungsgewicht: --</div>
    <div class="trust-badge" id="trust-badge">Analyse...</div>

    <div class="input-row">
      <label for="portion">Menge (Gramm):</label>
      <input type="number" id="portion" value="100" style="width: 100px;" oninput="recalculate()">
    </div>

    <div class="input-row" style="margin-top: 15px;">
      <label>Berechnet:</label>
      <div style="text-align: right;">
        <strong id="calc-protein" style="color: var(--accent-protein);">0g Protein</strong><br>
        <strong id="calc-calories" style="color: var(--accent-calories);">0 kcal</strong>
      </div>
    </div>

    <div class="btn-group" style="margin-top: 15px; margin-bottom: 0;">
      <button class="action-btn" onclick="addEntry()">Hinzufügen</button>
      <button class="action-btn danger-btn" onclick="cancelScan()">Abbrechen</button>
    </div>
  </div>
</div>

<script>
  // FÜGE HIER DEINEN OPENROUTER API-KEY EIN:
  const API_KEY = "sk-or-v1-DEIN_OPENROUTER_KEY_HIER_EINFUEGEN";

  let dailyProteinGoal = 140;
  let dailyCalorieGoal = 2000;

  let currentProteinTotal = 0;
  let currentCalorieTotal = 0;

  let lastAddedProtein = 0;
  let lastAddedCalories = 0;

  let detectedProteinPer100g = 0;
  let detectedCaloriesPer100g = 0;
  let codeReader = null;

  const photoInput = document.getElementById('photo-input');
  const resultCard = document.getElementById('result-card');
  const previewImg = document.getElementById('preview-img');
  const portionInput = document.getElementById('portion');
  const calcProteinText = document.getElementById('calc-protein');
  const calcCaloriesText = document.getElementById('calc-calories');

  // --- INITIALISIERUNG & PERSISTENZ ---
  window.addEventListener('DOMContentLoaded', () => {
    loadProfileAndGoals();
    loadDailyProgress();
  });

  function openOnboarding() {
    document.getElementById('onboarding-modal').style.display = 'flex';
  }

  function saveUserProfile() {
    const gender = document.getElementById('user-gender').value;
    const age = parseFloat(document.getElementById('user-age').value) || 25;
    const height = parseFloat(document.getElementById('user-height').value) || 175;
    const weight = parseFloat(document.getElementById('user-weight').value) || 75;
    const goal = document.getElementById('user-goal').value;

    // Grundumsatzberechnung (Mifflin-St Jeor)
    let bmr = (10 * weight) + (6.25 * height) - (5 * age);
    bmr += (gender === 'male') ? 5 : -161;

    // Leistungsumsatz (Durchschnittliche Aktivität PAL 1.4)
    let tdee = bmr * 1.4;

    // Zielanpassung Kalorien & Protein
    if (goal === 'build') {
      dailyCalorieGoal = Math.round(tdee + 300);
      dailyProteinGoal = Math.round(weight * 2.0); // 2g pro kg für Muskelaufbau
    } else if (goal === 'lose') {
      dailyCalorieGoal = Math.round(tdee - 500);
      dailyProteinGoal = Math.round(weight * 2.2); // 2.2g pro kg für Muskelerhalt im Defizit
    } else {
      dailyCalorieGoal = Math.round(tdee);
      dailyProteinGoal = Math.round(weight * 1.6); // Normaler Bedarf
    }

    localStorage.setItem('user_goals', JSON.stringify({
      dailyProteinGoal,
      dailyCalorieGoal,
      gender, age, height, weight, goal
    }));

    document.getElementById('onboarding-modal').style.display = 'none';
    updateUI();
  }

  function loadProfileAndGoals() {
    const savedGoals = localStorage.getItem('user_goals');
    if (savedGoals) {
      const data = JSON.parse(savedGoals);
      dailyProteinGoal = data.dailyProteinGoal || 140;
      dailyCalorieGoal = data.dailyCalorieGoal || 2000;
      
      if (data.gender) document.getElementById('user-gender').value = data.gender;
      if (data.age) document.getElementById('user-age').value = data.age;
      if (data.height) document.getElementById('user-height').value = data.height;
      if (data.weight) document.getElementById('user-weight').value = data.weight;
      if (data.goal) document.getElementById('user-goal').value = data.goal;
    } else {
      openOnboarding();
    }
  }

  function saveDailyProgress() {
    localStorage.setItem('daily_progress', JSON.stringify({
      currentProteinTotal,
      currentCalorieTotal
    }));
  }

  function loadDailyProgress() {
    const savedProgress = localStorage.getItem('daily_progress');
    if (savedProgress) {
      const data = JSON.parse(savedProgress);
      currentProteinTotal = data.currentProteinTotal || 0;
      currentCalorieTotal = data.currentCalorieTotal || 0;
    }
    updateUI();
  }

  // --- 1. KI ERKENNUNG MIT BILD-OPTIMIERUNG ---
  photoInput.addEventListener('change', function() {
    if (this.files && this.files[0]) {
      const file = this.files[0];
      
      previewImg.src = URL.createObjectURL(file);
      previewImg.style.display = 'block';
      resultCard.style.display = 'block';
      
      document.getElementById('detected-food').innerText = "KI analysiert das Bild...";
      document.getElementById('detected-package').innerText = "";
      document.getElementById('trust-badge').innerText = "Bild wird optimiert & gesendet...";

      resizeImage(file, 800, 800, async function(base64Data) {
        await analyzeWithOpenRouter(base64Data);
      });
    }
  });

  function resizeImage(file, maxWidth, maxHeight, callback) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
        } else {
          if (height > maxHeight) {
            width = Math.round((width * maxHeight) / height);
            height = maxHeight;
          }
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        callback(dataUrl.split(',')[1]);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function analyzeWithOpenRouter(base64Data) {
    try {
      const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${API_KEY}`,
          "HTTP-Referer": window.location.origin,
          "X-Title": "Protein Tracker",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          "model": "openrouter/free",
          "messages": [
            {
              "role": "user",
              "content": [
                {
                  "type": "text",
                  "text": "Identify the main food or product in this image. Estimate nutritional values per 100g AND identify or estimate the product's standard full package weight in grams (even if not explicitly written, use product recognition knowledge). Return ONLY raw JSON with keys: foodName (string in German), proteinPer100g (number), caloriesPer100g (number), totalPackageGrams (number or 100 if unknown/plate food), confidencePercent (number 0-100). Example: {\"foodName\": \"Ehrmann High Protein Pudding\", \"proteinPer100g\": 10, \"caloriesPer100g\": 76, \"totalPackageGrams\": 200, \"confidencePercent\": 95}"
                },
                {
                  "type": "image_url",
                  "image_url": {
                    "url": `data:image/jpeg;base64,${base64Data}`
                  }
                }
              ]
            }
          ]
        })
      });

      const data = await response.json();

      if (data.error) {
        document.getElementById('detected-food').innerText = "API-Fehler";
        document.getElementById('trust-badge').innerText = data.error.message || "Fehler von OpenRouter";
        return;
      }

      const rawText = data.choices[0].message.content.trim();
      const jsonMatch = rawText.match(/\{[\s\S]*\}/);
      
      if (!jsonMatch) {
        throw new Error("Kein JSON gefunden");
      }

      const result = JSON.parse(jsonMatch[0]);

      document.getElementById('detected-food').innerText = result.foodName || "Erkanntes Essen";
      
      const pkgGrams = result.totalPackageGrams || 100;
      document.getElementById('detected-package').innerText = `Geschätztes Packungsgewicht: ${pkgGrams}g`;
      document.getElementById('trust-badge').innerText = `KI-Genauigkeit: ${result.confidencePercent || 80}%`;
      
      detectedProteinPer100g = result.proteinPer100g || 0;
      detectedCaloriesPer100g = result.caloriesPer100g || 0;
      
      portionInput.value = pkgGrams;
      recalculate();

    } catch (error) {
      console.error(error);
      document.getElementById('detected-food').innerText = "Erkennungsfehler";
      document.getElementById('trust-badge').innerText = "Bild konnte nicht ausgewertet werden.";
    }
  }

  // --- 2. BARCODE SCANNER ---
  function startBarcodeScanner() {
    document.getElementById('barcode-scanner').style.display = 'block';
    codeReader = new ZXing.BrowserMultiFormatReader();
    
    codeReader.decodeFromVideoDevice(null, 'barcode-video', (result, err) => {
      if (result) {
        fetchProductByBarcode(result.text);
        stopBarcodeScanner();
      }
    });
  }

  function stopBarcodeScanner() {
    if (codeReader) {
      codeReader.reset();
    }
    document.getElementById('barcode-scanner').style.display = 'none';
  }

  async function fetchProductByBarcode(barcode) {
    resultCard.style.display = 'block';
    previewImg.style.display = 'none';
    document.getElementById('detected-food').innerText = "Suche Barcode...";
    document.getElementById('detected-package').innerText = "";

    try {
      const response = await fetch(`https://de.openfoodfacts.org/api/v0/product/${barcode}.json`);
      const data = await response.json();

      if (data.status === 1) {
        const product = data.product;
        const name = product.product_name_de || product.product_name || "Unbekanntes Produkt";
        const protein = product.nutriments ? (product.nutriments.proteins_100g || 0) : 0;
        const calories = product.nutriments ? (product.nutriments['energy-kcal_100g'] || 0) : 0;
        
        let pkgWeight = 100;
        if (product.product_quantity) {
          pkgWeight = parseFloat(product.product_quantity) || 100;
        }

        document.getElementById('detected-food').innerText = name;
        document.getElementById('detected-package').innerText = `Packungsgröße: ${product.quantity || pkgWeight + 'g'}`;
        document.getElementById('trust-badge').innerText = "Exakter Barcode-Treffer";
        
        detectedProteinPer100g = protein;
        detectedCaloriesPer100g = calories;
        
        portionInput.value = pkgWeight;
        recalculate();
      } else {
        document.getElementById('detected-food').innerText = "Produkt nicht in der Datenbank.";
      }
    } catch (error) {
      document.getElementById('detected-food').innerText = "Netzwerkfehler beim Scannen.";
    }
  }

  // --- 3. RECHNER UND KORREKTUR-FUNKTIONEN ---
  function recalculate() {
    let grams = parseFloat(portionInput.value) || 0;
    let totalProtein = (grams / 100) * detectedProteinPer100g;
    let totalCalories = (grams / 100) * detectedCaloriesPer100g;

    calcProteinText.innerText = totalProtein.toFixed(1) + "g Protein";
    calcCaloriesText.innerText = Math.round(totalCalories) + " kcal";
  }

  function addEntry() {
    let grams = parseFloat(portionInput.value) || 0;
    let addedProtein = (grams / 100) * detectedProteinPer100g;
    let addedCalories = (grams / 100) * detectedCaloriesPer100g;
    
    lastAddedProtein = addedProtein;
    lastAddedCalories = addedCalories;

    currentProteinTotal += addedProtein;
    currentCalorieTotal += addedCalories;
    
    saveDailyProgress();
    updateUI();
    cancelScan();
  }

  function cancelScan() {
    resultCard.style.display = 'none';
    photoInput.value = "";
    previewImg.src = "";
    detectedProteinPer100g = 0;
    detectedCaloriesPer100g = 0;
  }

  function undoLastEntry() {
    if (lastAddedProtein > 0 || lastAddedCalories > 0) {
      currentProteinTotal = Math.max(0, currentProteinTotal - lastAddedProtein);
      currentCalorieTotal = Math.max(0, currentCalorieTotal - lastAddedCalories);
      
      lastAddedProtein = 0;
      lastAddedCalories = 0;
      saveDailyProgress();
      updateUI();
    }
  }

  function resetDay() {
    if (confirm("Möchtest du die heutigen Einträge wirklich zurücksetzen?")) {
      currentProteinTotal = 0;
      currentCalorieTotal = 0;
      lastAddedProtein = 0;
      lastAddedCalories = 0;
      saveDailyProgress();
      updateUI();
    }
  }

  function updateUI() {
    document.getElementById('target-protein').innerText = dailyProteinGoal;
    document.getElementById('target-calories').innerText = dailyCalorieGoal;

    document.getElementById('current-protein').innerText = currentProteinTotal.toFixed(1);
    let proteinPercentage = Math.min((currentProteinTotal / dailyProteinGoal) * 100, 100);
    document.getElementById('progress-fill-protein').style.width = proteinPercentage + "%";

    document.getElementById('current-calories').innerText = Math.round(currentCalorieTotal);
    let caloriePercentage = Math.min((currentCalorieTotal / dailyCalorieGoal) * 100, 100);
    document.getElementById('progress-fill-calories').style.width = caloriePercentage + "%";
  }
</script>

</body>
</html>
