<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protein Tracker Pro</title>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #FF5722;
      --text-color: #ffffff;
      --text-dim: #aaa;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      color: var(--accent-color);
      margin-bottom: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .progress-bar-bg {
      background: #333;
      height: 20px;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-bar-fill {
      background: var(--accent-color);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .action-btn {
      flex: 1;
      background: var(--accent-color);
      color: white;
      text-align: center;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      font-size: 0.9rem;
    }

    .secondary-btn {
      background: #333;
      border: 1px solid #555;
    }

    input[type="file"] {
      display: none;
    }

    #preview-img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 10px;
      display: none;
      max-height: 200px;
      object-fit: cover;
    }

    .input-group {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    input[type="number"] {
      background: #2a2a2a;
      border: 1px solid #444;
      color: white;
      padding: 8px;
      border-radius: 6px;
      width: 80px;
      text-align: center;
      font-size: 1rem;
    }

    .trust-badge {
      font-size: 0.85rem;
      color: #FF9800;
      margin-top: 5px;
    }

    #barcode-scanner {
      display: none;
      margin-bottom: 15px;
    }

    video {
      width: 100%;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Protein Tracker Pro</h1>

  <!-- Fortschrittsanzeige -->
  <div class="card">
    <h3>Tagesziel: <span id="current-protein">0</span> / <span id="target-protein">140</span>g Protein</h3>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

  <!-- Aktionen -->
  <div class="btn-group">
    <label class="action-btn">
      📷 Teller scannen (KI)
      <input type="file" accept="image/*" capture="environment" id="photo-input">
    </label>
    <button class="action-btn secondary-btn" onclick="startBarcodeScanner()">
      █║▌ Barcode
    </button>
  </div>

  <!-- Live Barcode Kamera Bereich -->
  <div class="card" id="barcode-scanner">
    <h4>Barcode in die Kamera halten:</h4>
    <video id="barcode-video"></video>
    <button class="action-btn secondary-btn" style="margin-top:10px;" onclick="stopBarcodeScanner()">Abbrechen</button>
  </div>

  <!-- Ergebnisse & Anpassung -->
  <div class="card" id="result-card" style="display: none;">
    <img id="preview-img" src="" alt="Vorschau">
    <h4 id="detected-food">Warte auf Eingabe...</h4>
    <div class="trust-badge" id="trust-badge">Analyse...</div>

    <div class="input-group">
      <label for="portion">Portion in Gramm:</label>
      <input type="number" id="portion" value="100" oninput="recalculate()">
    </div>

    <div class="input-group">
      <label>Berechnetes Protein:</label>
      <strong id="calc-protein">0g</strong>
    </div>

    <button class="action-btn" style="margin-top: 15px; width:100%;" onclick="addProtein()">Zum Tagesziel hinzufügen</button>
  </div>
</div>

<script>
  // FÜGE HIER DEINEN OPENROUTER API-KEY EIN:
  const API_KEY = "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";

  let dailyGoal = 140;
  let currentTotal = 0;
  let detectedProteinPer100g = 0;
  let codeReader = null;

  const photoInput = document.getElementById('photo-input');
  const resultCard = document.getElementById('result-card');
  const previewImg = document.getElementById('preview-img');
  const portionInput = document.getElementById('portion');
  const calcProteinText = document.getElementById('calc-protein');

  // --- 1. KI ERKENNUNG (OpenRouter) ---
  photoInput.addEventListener('change', async function() {
    if (this.files && this.files[0]) {
      const file = this.files[0];
      
      previewImg.src = URL.createObjectURL(file);
      previewImg.style.display = 'block';
      resultCard.style.display = 'block';
      
      document.getElementById('detected-food').innerText = "KI analysiert das Bild...";
      document.getElementById('trust-badge').innerText = "Essen wird erkannt...";

      const reader = new FileReader();
      reader.onloadend = async function() {
        const base64Data = reader.result.split(',')[1];
        await analyzeWithOpenRouter(base64Data);
      };
      reader.readAsDataURL(file);
    }
  });

  async function analyzeWithOpenRouter(base64Data) {
    try {
      const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${API_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          "model": "meta-llama/llama-3.2-11b-vision-instruct:free",
          "messages": [
            {
              "role": "user",
              "content": [
                {
                  "type": "text",
                  "text": "Analysiere dieses Essen auf dem Bild. Antworte AUSSCHLIESSLICH im JSON-Format ohne weiteren Text: {\"foodName\": \"Name des Essens\", \"proteinPer100g\": Zahl_Gramm, \"confidencePercent\": Zahl_von_0_bis_100}"
                },
                {
                  "type": "image_url",
                  "image_url": {
                    "url": `data:image/jpeg;base64,${base64Data}`
                  }
                }
              ]
            }
          ]
        })
      });

      const data = await response.json();
      const rawText = data.choices[0].message.content.trim();
      const result = JSON.parse(rawText.replace(/```json|```/g, ""));

      document.getElementById('detected-food').innerText = result.foodName;
      document.getElementById('trust-badge').innerText = `KI-Genauigkeit: ${result.confidencePercent}%`;
      
      detectedProteinPer100g = result.proteinPer100g;
      portionInput.value = 100;
      recalculate();

    } catch (error) {
      console.error(error);
      document.getElementById('detected-food').innerText = "Erkennungsfehler";
      document.getElementById('trust-badge').innerText = "Prüfe den API-Key in der Datei.";
    }
  }

  // --- 2. BARCODE SCANNER (Open Food Facts) ---
  function startBarcodeScanner() {
    document.getElementById('barcode-scanner').style.display = 'block';
    codeReader = new ZXing.BrowserMultiFormatReader();
    
    codeReader.decodeFromVideoDevice(null, 'barcode-video', (result, err) => {
      if (result) {
        fetchProductByBarcode(result.text);
        stopBarcodeScanner();
      }
    });
  }

  function stopBarcodeScanner() {
    if (codeReader) {
      codeReader.reset();
    }
    document.getElementById('barcode-scanner').style.display = 'none';
  }

  async function fetchProductByBarcode(barcode) {
    resultCard.style.display = 'block';
    previewImg.style.display = 'none';
    document.getElementById('detected-food').innerText = "Suche Barcode...";

    try {
      const response = await fetch(`https://de.openfoodfacts.org/api/v0/product/${barcode}.json`);
      const data = await response.json();

      if (data.status === 1) {
        const product = data.product;
        const name = product.product_name_de || product.product_name || "Unbekanntes Produkt";
        const protein = product.nutriments ? (product.nutriments.proteins_100g || 0) : 0;

        document.getElementById('detected-food').innerText = name;
        document.getElementById('trust-badge').innerText = "Exakter Barcode-Treffer";
        
        detectedProteinPer100g = protein;
        portionInput.value = 100;
        recalculate();
      } else {
        document.getElementById('detected-food').innerText = "Produkt nicht in der Datenbank.";
      }
    } catch (error) {
      document.getElementById('detected-food').innerText = "Netzwerkfehler beim Scannen.";
    }
  }

  // --- 3. RECHNER UND FORTSCHRITT ---
  function recalculate() {
    let grams = parseFloat(portionInput.value) || 0;
    let total = (grams / 100) * detectedProteinPer100g;
    calcProteinText.innerText = total.toFixed(1) + "g";
  }

  function addProtein() {
    let grams = parseFloat(portionInput.value) || 0;
    let addedProtein = (grams / 100) * detectedProteinPer100g;
    currentTotal += addedProtein;
    
    document.getElementById('current-protein').innerText = currentTotal.toFixed(1);
    
    let percentage = Math.min((currentTotal / dailyGoal) * 100, 100);
    document.getElementById('progress-fill').style.width = percentage + "%";
    
    resultCard.style.display = 'none';
  }
</script>

</body>
</html>
