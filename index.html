<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protein Tracker</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #FF5722;
      --text-color: #ffffff;
      --text-dim: #aaa;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      color: var(--accent-color);
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .progress-bar-bg {
      background: #333;
      height: 20px;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-bar-fill {
      background: var(--accent-color);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .upload-btn {
      display: block;
      width: 100%;
      background: var(--accent-color);
      color: white;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 15px;
      box-sizing: border-box;
      border: none;
    }

    input[type="file"] {
      display: none;
    }

    .food-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 10px 0;
    }

    .food-btn {
      background: #2a2a2a;
      border: 1px solid #444;
      color: white;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .food-btn:active {
      background: var(--accent-color);
    }

    .input-group {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    input[type="number"] {
      background: #2a2a2a;
      border: 1px solid #444;
      color: white;
      padding: 8px;
      border-radius: 6px;
      width: 80px;
      text-align: center;
    }

    .trust-badge {
      font-size: 0.85rem;
      color: #FF9800;
      margin-top: 5px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Protein Tracker</h1>

  <!-- Fortschritsanzeige -->
  <div class="card">
    <h3>Tagesziel: <span id="current-protein">0</span> / <span id="target-protein">140</span>g Protein</h3>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

  <!-- Foto Upload -->
  <label class="upload-btn">
    📷 Essen fotografieren
    <input type="file" accept="image/*" capture="environment" id="photo-input">
  </label>

  <!-- Ergebnisse & Anpassung -->
  <div class="card" id="result-card" style="display: none;">
    <h4 id="detected-food">Essen auswählen:</h4>
    <div class="trust-badge">Manuelle Lebensmittelauswahl</div>

    <div class="food-selector">
      <button class="food-btn" onclick="selectFood('ei')">🍳 Ei (13g/100g)</button>
      <button class="food-btn" onclick="selectFood('haehnchen')">🍗 Hähnchen (31g/100g)</button>
      <button class="food-btn" onclick="selectFood('quark')">🥣 Magerquark (12g/100g)</button>
      <button class="food-btn" onclick="selectFood('apfel')">🍎 Apfel (0.3g/100g)</button>
    </div>

    <div class="input-group">
      <label for="portion">Portionsgröße (g):</label>
      <input type="number" id="portion" value="100" oninput="recalculate()">
    </div>

    <div class="input-group">
      <label>Berechnetes Protein:</label>
      <strong id="calc-protein">0g</strong>
    </div>

    <button class="upload-btn" style="margin-top: 15px;" onclick="addProtein()">Zum Tagesziel hinzufügen</button>
  </div>
</div>

<script>
  let dailyGoal = 140;
  let currentTotal = 0;

  const foodDatabase = {
    "ei": { name: "Gebratenes Ei", protein: 13 },
    "haehnchen": { name: "Hähnchenbrust", protein: 31 },
    "quark": { name: "Magerquark", protein: 12 },
    "apfel": { name: "Apfel", protein: 0.3 }
  };

  let selectedProteinPer100g = 0;

  const photoInput = document.getElementById('photo-input');
  const resultCard = document.getElementById('result-card');
  const portionInput = document.getElementById('portion');
  const calcProteinText = document.getElementById('calc-protein');

  photoInput.addEventListener('change', function() {
    if (this.files && this.files[0]) {
      resultCard.style.display = 'block';
    }
  });

  function selectFood(key) {
    const food = foodDatabase[key];
    document.getElementById('detected-food').innerText = "Ausgewählt: " + food.name;
    selectedProteinPer100g = food.protein;
    recalculate();
  }

  function recalculate() {
    let grams = parseFloat(portionInput.value) || 0;
    let total = (grams / 100) * selectedProteinPer100g;
    calcProteinText.innerText = total.toFixed(1) + "g";
  }

  function addProtein() {
    let grams = parseFloat(portionInput.value) || 0;
    let addedProtein = (grams / 100) * selectedProteinPer100g;
    currentTotal += addedProtein;
    
    document.getElementById('current-protein').innerText = currentTotal.toFixed(1);
    
    let percentage = Math.min((currentTotal / dailyGoal) * 100, 100);
    document.getElementById('progress-fill').style.width = percentage + "%";
    
    resultCard.style.display = 'none';
  }
</script>

</body>
</html>
